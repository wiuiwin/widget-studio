<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>날씨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../css/weather.css?v=13">
  <style>
    html, body { height: 100%; margin: 0; background: transparent; }
    #w { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <!-- 노션 임베드용: 설정은 전부 URL 쿼리로 받는다 -->
  <div id="w"></div>
  <script type="module">
    import { createWeather, fromQuery, WEATHER_DEFAULTS } from '../js/weather.js?v=13';
    createWeather(document.getElementById('w'), fromQuery(location.search, WEATHER_DEFAULTS));
  </script>
</body>
</html>
