<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>타이머</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../css/clock.css?v=11">
  <style>
    html, body { height: 100%; margin: 0; background: transparent; }
    #clock { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <!-- 노션 임베드용: 설정은 전부 URL 쿼리로 받는다 -->
  <div id="clock"></div>
  <script type="module">
    import { createTimer, fromQuery, TIMER_DEFAULTS } from '../js/timer.js?v=11';
    // 뽀모도로 진행 상태는 위젯 주소마다 따로 저장
    createTimer(document.getElementById('clock'), fromQuery(location.search, TIMER_DEFAULTS), 'ws-pomo:' + location.search);
  </script>
</body>
</html>
