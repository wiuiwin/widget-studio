<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>위젯 스튜디오 — 타이머</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%277%27 fill=%27%231d1d1f%27/%3E%3Cpath d=%27M8 4v4l3 2%27 stroke=%27white%27 stroke-width=%271.6%27 fill=%27none%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../css/clock.css?v=11">
  <link rel="stylesheet" href="../css/editor.css?v=11">
</head>
<body>
  <aside class="panel">
    <header class="panel-head">
      <a class="back" href="../" title="홈으로">‹</a>
      <h1>타이머</h1>
    </header>

    <div class="panel-body">
      <section>
        <h2>설정</h2>

        <div class="field">
          <span>타이머 종류</span>
          <div class="segmented" data-opt="mode">
            <button value="count">카운트다운</button>
            <button value="pomo">뽀모도로</button>
          </div>
        </div>

        <label class="field" data-show="count">
          <span>목표 날짜·시간</span>
          <input class="text-input" type="datetime-local" data-opt="target">
        </label>

        <div class="field" data-show="pomo">
          <span class="field-row">집중 시간 <output data-for="focus" data-suffix="분"></output></span>
          <input type="range" class="range" data-opt="focus" min="5" max="90" step="5">
        </div>
        <div class="field" data-show="pomo">
          <span class="field-row">휴식 시간 <output data-for="brk" data-suffix="분"></output></span>
          <input type="range" class="range" data-opt="brk" min="1" max="30" step="1">
        </div>

        <label class="field">
          <span>디자인</span>
          <select data-opt="type"></select>
        </label>

        <label class="toggle" data-show="count"><span>초 표시</span><input type="checkbox" data-opt="seconds"><i></i></label>
        <label class="toggle"><span>단위 표시 (일·시간·분·초)</span><input type="checkbox" data-opt="caps"><i></i></label>
        <label class="toggle"><span>라벨 추가</span><input type="checkbox" id="label-on"><i></i></label>
        <input class="text-input" id="label-text" placeholder="예: 수능까지, 오늘의 집중" maxlength="40" hidden>
        <label class="toggle" data-show="solid"><span>텍스트를 박스 안에 넣기</span><input type="checkbox" data-opt="inside"><i></i></label>
      </section>

      <section>
        <h2>스타일</h2>

        <div class="field">
          <span>크기</span>
          <div class="segmented" data-opt="size">
            <button value="s">작게</button>
            <button value="m">보통</button>
            <button value="l">크게</button>
            <button value="f">꽉 차게</button>
          </div>
        </div>

        <div class="field" data-show="padded">
          <span class="field-row"><span id="inpad-label">카드 안쪽 여백</span> <output data-for="inpad"></output></span>
          <input type="range" class="range" data-opt="inpad" min="0" max="40" step="1">
        </div>

        <div class="field" data-show="roulette">
          <span class="field-row">위아래 숫자 보이기 <output data-for="peek" data-suffix="%"></output></span>
          <input type="range" class="range" data-opt="peek" min="0" max="100" step="5">
        </div>

        <div class="field" data-show="flip">
          <span>정렬</span>
          <div class="segmented" data-opt="align">
            <button value="start">왼쪽</button>
            <button value="center">가운데</button>
            <button value="end">오른쪽</button>
          </div>
        </div>

        <div class="field">
          <span class="field-row">폰트 <output id="font-name"></output></span>
          <div class="font-tiles" data-opt="font"></div>
        </div>

        <label class="toggle"><span>그림자</span><input type="checkbox" data-opt="shadow"><i></i></label>
        <label class="toggle"><span>워터마크 표시</span><input type="checkbox" data-opt="wm"><i></i></label>
        <label class="toggle"><span>다크 모드 연동</span><input type="checkbox" data-opt="sync"><i></i></label>

        <div class="field">
          <span class="field-row">컬러 테마 <output id="theme-name"></output></span>
          <div class="swatches collapsed" data-opt="theme"></div>
          <button class="more" id="theme-more" type="button"></button>
        </div>

        <div class="field colors">
          <label><span id="c-main">배경판</span><input type="color" data-color="main"></label>
          <label><span id="c-sub">숫자</span><input type="color" data-color="sub"></label>
          <label><span>포인트</span><input type="color" data-color="accent"></label>
          <label><span>텍스트</span><input type="color" data-color="text"></label>
        </div>

        <div class="field">
          <span>배경</span>
          <div class="segmented" data-opt="bg">
            <button value="transparent">투명</button>
            <button value="#ffffff">흰색</button>
            <button value="#191919">노션 다크</button>
          </div>
        </div>
      </section>
    </div>

    <footer class="panel-foot">
      <h2>링크를 복사해 노션에 붙여넣고 '임베드'를 누르세요</h2>
      <div class="embed">
        <input id="embed-url" readonly>
        <button id="copy" title="링크 복사">복사</button>
      </div>
    </footer>
  </aside>

  <main class="stage">
    <p class="hint">💡 오른쪽 아래 모서리를 드래그해서 크기별 모습을 미리 보세요</p>
    <div class="frame" id="frame">
      <div id="clock"></div>
      <span class="frame-size" id="frame-size"></span>
    </div>
  </main>

  <script type="module">
    import { initEditor } from '../js/editor.js?v=11';
    import { createTimer, TIMER_DEFAULTS, TIMER_TYPES, defaultTarget } from '../js/timer.js?v=11';
    initEditor({
      widget: 'timer',
      // 카운트다운 목표는 빈 값이면 '다음 새해' — 에디터에서는 날짜칸에 보이도록 채워 둔다
      defaults: { ...TIMER_DEFAULTS, target: defaultTarget() },
      create: (root, opts) => createTimer(root, opts, 'ws-pomo-editor'),
      types: TIMER_TYPES,
      visible: o => ({ count: o.mode === 'count', pomo: o.mode === 'pomo' }),
    });
  </script>
</body>
</html>
